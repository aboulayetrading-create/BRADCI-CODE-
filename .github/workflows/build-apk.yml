name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences et installer le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Installer et compiler l'application Vite (BRADCI)
        run: |
          npm install --legacy-peer-deps --force
          npm run build || npx vite build

      - name: Générer le conteneur natif Android propre
        run: |
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 --save-exact --legacy-peer-deps --force
          rm -rf android capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Fixer les dépendances Gradle et verrouiller les versions AndroidX
        run: |
          cd android
          # Empêcher le téléchargement de versions instables d'AndroidX
          cat << 'EOF' > fix_deps.gradle
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force 'androidx.core:core:1.13.1'
                      force 'androidx.core:core-ktx:1.13.1'
                      force 'androidx.activity:activity:1.9.0'
                      force 'androidx.activity:activity-ktx:1.9.0'
                      force 'androidx.appcompat:appcompat:1.6.1'
                  }
              }
          }
          EOF
          echo "apply from: 'fix_deps.gradle'" >> build.gradle
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties

      - name: Remplacer le logo par icon.png
        run: |
          if [ -f "icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              if [ -d "$d" ] && [ "$(basename $d)" != "mipmap-anydpi-v26" ]; then
                cp icon.png "$d/ic_launcher.png"
                cp icon.png "$d/ic_launcher_round.png"
              fi
            done
          fi

      - name: Configurer les autorisations Android
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
