name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source complet
        uses: actions/checkout@v4

      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compiler et rassembler TOUS les fichiers du projet
        run: |
          # 1. Tenter la compilation Vite complète
          bun install --no-save || npm install --legacy-peer-deps --force
          bun run build || npx vite build || true

          # 2. Créer le dossier dist final et y injecter l'intégralité du projet
          mkdir -p dist

          # Copier l'intégralité des dossiers de médias, données et assets
          if [ -d "assets" ]; then
            cp -r assets dist/
          fi
          if [ -d "public" ]; then
            cp -r public/* dist/ || true
          fi
          if [ -d "src" ]; then
            cp -r src dist/ || true
          fi

          # S'assurer que le fichier index.html principal est à la racine de dist
          if [ -f "index.html" ]; then
            cp index.html dist/index.html
          fi

          # Corriger tous les chemins absolus pour qu'Android puisse lire l'intégralité des fichiers
          sed -i 's|src="/|src="./|g' dist/index.html
          sed -i 's|href="/|href="./|g' dist/index.html

          echo "=== Taille totale des fichiers intégrés dans dist ==="
          du -sh dist/

      - name: Créer le conteneur Android avec l'intégralité des données
        run: |
          # Sauvegarde des données complètes
          mkdir -p /tmp/bradci_bundle
          cp -r dist /tmp/bradci_bundle/
          cp icon.png /tmp/bradci_bundle/ || true

          # Nettoyer l'environnement sans impacter dist
          rm -rf android capacitor.config.* package.json bun.lock node_modules

          cat << 'EOF' > package.json
          {
            "name": "bradci",
            "version": "1.0.0",
            "private": true
          }
          EOF

          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 --save-exact
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          # Restaurer l'intégralité du code et des médias dans le dossier web
          cp -r /tmp/bradci_bundle/dist ./
          if [ -f "/tmp/bradci_bundle/icon.png" ]; then
            cp /tmp/bradci_bundle/icon.png ./
          fi

          npx cap add android
          npx cap copy android

      - name: Appliquer le logo BRADCI (icon.png)
        run: |
          if [ -f "icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              if [ -d "$d" ] && [ "$(basename $d)" != "mipmap-anydpi-v26" ]; then
                cp icon.png "$d/ic_launcher.png"
                cp icon.png "$d/ic_launcher_round.png"
              fi
            done
          fi

      - name: Configurer MultiDex et autorisations Android
        run: |
          cd android
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> gradle.properties
          sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/g' app/build.gradle

          MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android final (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK complet
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-Complete-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
