name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer l'environnement Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Copier les assets web dans le projet Android
        run: |
          mkdir -p android/app/src/main/assets/public
          if [ -d "assets/public" ]; then
            cp -r assets/public/* android/app/src/main/assets/public/
          fi
          if [ -f "assets/capacitor.config.json" ]; then
            cp assets/capacitor.config.json android/app/src/main/assets/
          fi

      - name: Préparer les permissions AndroidManifest
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST_FILE
          fi

      - name: Forcer Gradle 8.2 stable et options JVM
        run: |
          cd android
          chmod +x ./gradlew
          sed -i 's/gradle-8.14.3-all.zip/gradle-8.2.1-all.zip/g' gradle/wrapper/gradle-wrapper.properties || true
          echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> gradle.properties

      - name: Compiler l'APK Android
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --no-build-cache

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
