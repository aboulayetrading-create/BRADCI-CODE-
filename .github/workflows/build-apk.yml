name: Build Production Android App (BRAD'CI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          export CI=false
          npm run build || npx vite build

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "BRAD'CI" "com.bradci.app" --web-dir dist || true
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Fix Duplicate Kotlin Standard Libraries
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Official-APK-Production
          path: android/app/build/outputs/apk/debug/app-debug.apk
