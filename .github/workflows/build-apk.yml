name: Build Production Android App (BRAD'CI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          export CI=false
          npm run build || npx vite build

      - name: Configure Capacitor & Add Android
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps
          npx cap init "BRAD'CI" "com.bradci.app" --web-dir dist || true
          npx cap add android || true
          npx cap sync android

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Generate Production Signing Key
        run: |
          keytool -genkeypair -v \
            -keystore android/app/bradci-release.jks \
            -alias ${{ secrets.RELEASE_KEY_ALIAS }} \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass ${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.RELEASE_KEY_PASSWORD }} \
            -dname "CN=BRADCI, OU=IT, O=BRADCI, L=Abidjan, C=CI" || true

      - name: Build Production Signed APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=app/bradci-release.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.RELEASE_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.RELEASE_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Official-APK-Production
          path: android/app/build/outputs/apk/release/app-release.apk
