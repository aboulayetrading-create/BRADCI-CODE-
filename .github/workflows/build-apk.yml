name: Build Production Android App (BRAD'CI)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-production:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: |
          export CI=false
          npm run build || npx vite build

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Capacitor & Generate BRAD'CI Official App Icons
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/assets @capacitor/geolocation @capacitor/camera --legacy-peer-deps
          npx cap init "BRAD'CI" "com.bradci.app" --web-dir dist || true
          
          # Initialize android platform if missing
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          
          # Prepare official icon in assets directory
          mkdir -p assets
          if [ -f "icon.png" ]; then
            cp icon.png assets/icon.png
            cp icon.png assets/icon-only.png
          fi
          
          # Generate all Android launcher icons & splash screens from BRAD'CI icon
          npx @capacitor/assets generate --android || npx capacitor-assets generate --android || true

          npx cap sync android

      - name: Add Android Manifest Permissions (GPS, Camera, Micro)
        run: |
          cat << 'EOF' > android/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="BRAD'CI"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:supportsRtl="true"
                  android:theme="@style/AppTheme">

                  <activity
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|locale|smallestScreenSize|screenLayout|uiMode"
                      android:name=".MainActivity"
                      android:label="BRAD'CI"
                      android:theme="@style/AppTheme.NoActionBar"
                      android:launchMode="singleTask"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Fix Kotlin Duplicates
        run: |
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --rerun-tasks

      - name: Upload Production APK
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Official-APK-Production
          path: android/app/build/outputs/apk/debug/app-debug.apk
