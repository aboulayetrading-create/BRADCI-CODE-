name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android (API 35)
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Installer les dépendances et compiler Vite
        run: |
          npm install --legacy-peer-deps --force
          npm run build || npx vite build

      - name: Initialiser et synchroniser Capacitor
        run: |
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 @capacitor/assets --save-exact --legacy-peer-deps --force
          rm -rf android capacitor.config.ts
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android

      - name: Mettre à jour les versions Android SDK (compileSdk 35)
        run: |
          # Aligner variables.gradle sur l'API 35
          if [ -f "android/variables.gradle" ]; then
            sed -i 's/compileSdkVersion = [0-9]*/compileSdkVersion = 35/g' android/variables.gradle
            sed -i 's/targetSdkVersion = [0-9]*/targetSdkVersion = 35/g' android/variables.gradle
          fi
          # Aligner app/build.gradle
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/compileSdkVersion rootProject.ext.compileSdkVersion/compileSdkVersion 35/g' android/app/build.gradle
            sed -i 's/targetSdkVersion rootProject.ext.targetSdkVersion/targetSdkVersion 35/g' android/app/build.gradle
          fi

      - name: Génération des icônes Android avec Capacitor Assets
        run: |
          if [ -f "icon.png" ]; then
            mkdir -p assets
            cp icon.png assets/icon-only.png
            cp icon.png assets/icon-foreground.png
            cp icon.png assets/icon-background.png
            npx @capacitor/assets generate --android || true
          fi
          npx cap sync android

      - name: Configurer les autorisations Android
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
