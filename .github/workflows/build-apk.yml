name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source complet
        uses: actions/checkout@v4

      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compiler le projet web
        run: |
          bun install || npm install --legacy-peer-deps --force
          bun run build || npm run build || npx vite build || true

          # S'assurer que le dossier webDir configuré reçoit tous les fichiers
          TARGET_DIR="dist"
          if [ -d "assets/public" ]; then
            TARGET_DIR="assets/public"
          fi

          if [ -d "dist" ]; then
            cp -rn dist/* "$TARGET_DIR/" 2>/dev/null || true
          fi

      - name: Synchroniser vers le dossier Android d'origine
        run: |
          npx cap sync android || npx cap copy android || true

      - name: Forcer le logo BRADCI sur toutes les icônes
        run: |
          if [ -f "icon.png" ]; then
            find android/app/src/main/res/ -name "ic_launcher*.png" -exec cp icon.png {} \;
          fi

      - name: Ajuster Gradle et compiler l'APK
        run: |
          cd android
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> gradle.properties
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK réparé
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-Reparee
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
