name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compiler le code source récent (Vite/React)
        run: |
          # Installation propre des dépendances avec Bun
          bun install --no-save || npm install --legacy-peer-deps --force
          
          # Nettoyage strict de l'ancien dossier de build
          rm -rf dist
          
          # Compilation du code le plus récent
          bun run build || npx vite build

          # Vérification de la présence de l'application compilée
          if [ ! -f "dist/index.html" ]; then
            echo "Alerte: dist/index.html non généré par Vite, copie de secours..."
            mkdir -p dist
            if [ -d "assets/public" ]; then
              cp -r assets/public/* dist/
            fi
            if [ -f "index.html" ]; then
              cp index.html dist/
            fi
          fi

          # Fix écran blanc : forcer les chemins relatifs pour WebView
          sed -i 's|src="/|src="./|g' dist/index.html
          sed -i 's|href="/|href="./|g' dist/index.html

      - name: Créer le conteneur Android Capacitor propre
        run: |
          mkdir -p /tmp/bradci_build
          cp -r dist /tmp/bradci_build/
          cp icon.png /tmp/bradci_build/ || true

          # Nettoyage des modules natifs obsolètes
          rm -rf android capacitor.config.* package.json bun.lock node_modules

          cat << 'EOF' > package.json
          {
            "name": "bradci",
            "version": "1.0.0",
            "private": true
          }
          EOF

          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 --save-exact
          
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF

          cp -r /tmp/bradci_build/dist ./
          if [ -f "/tmp/bradci_build/icon.png" ]; then
            cp /tmp/bradci_build/icon.png ./
          fi

          npx cap add android
          npx cap copy android

      - name: Appliquer le logo BRADCI (icon.png)
        run: |
          if [ -f "icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              if [ -d "$d" ] && [ "$(basename $d)" != "mipmap-anydpi-v26" ]; then
                cp icon.png "$d/ic_launcher.png"
                cp icon.png "$d/ic_launcher_round.png"
              fi
            done
          fi

      - name: Configurer les autorisations et options Gradle
        run: |
          cd android
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> gradle.properties
          sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/g' app/build.gradle

          MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android final (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
