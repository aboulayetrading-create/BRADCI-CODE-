name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Installer les dépendances et compiler Vite
        run: |
          # Désinstaller le plugin caméra conflictuel de package.json
          npm uninstall @capacitor/camera @capacitor/geolocation || true
          npm install --legacy-peer-deps --force
          npm run build || npx vite build

      - name: Initialiser le conteneur Capacitor officiel propre
        run: |
          # Nettoyage complet des anciens artefacts de build
          rm -rf android capacitor.config.ts node_modules/@capacitor/camera
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 --save-exact --legacy-peer-deps --force
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Verrouiller les dépendances Gradle
        run: |
          cd android
          # Désactiver l'inclusion de plugins natifs résiduels dans settings.gradle
          sed -i '/capacitor-camera/d' settings.gradle || true
          sed -i '/capacitor-geolocation/d' settings.gradle || true
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> gradle.properties

      - name: Remplacer le logo par icon.png
        run: |
          if [ -f "icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              if [ -d "$d" ] && [ "$(basename $d)" != "mipmap-anydpi-v26" ]; then
                cp icon.png "$d/ic_launcher.png"
                cp icon.png "$d/ic_launcher_round.png"
              fi
            done
          fi

      - name: Configurer les autorisations Android
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
