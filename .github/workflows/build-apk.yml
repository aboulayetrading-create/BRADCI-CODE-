name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Installation de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Préparer le dossier dist et index.html
        run: |
          mkdir -p dist
          # Si un dossier assets/public existe, copier son contenu
          if [ -d "assets/public" ]; then
            cp -r assets/public/* dist/
          fi
          # Si un index.html est à la racine, le copier dans dist
          if [ -f "index.html" ]; then
            cp index.html dist/
          fi
          # Si dist n'a toujours pas d'index.html, chercher le premier index.html disponible
          if [ ! -f "dist/index.html" ]; then
            FOUND_INDEX=$(find . -name "index.html" -not -path "*/.*" -not -path "./dist/*" | head -n 1)
            if [ -n "$FOUND_INDEX" ]; then
              cp "$FOUND_INDEX" dist/index.html
            else
              # Création d'un conteneur minimal si non trouvé pour débloquer Capacitor
              echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>BRADCI</title></head><body><div id="root"></div></body></html>' > dist/index.html
            fi
          fi

      - name: Installer les dépendances et synchroniser Capacitor
        run: |
          npm install --legacy-peer-deps
          npx cap sync android

      - name: Ajouter les autorisations au Manifeste
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
