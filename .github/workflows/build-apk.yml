name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source le plus récent
        uses: actions/checkout@v4

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurer le SDK Android
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Injecter les derniers assets compilés BRADCI
        run: |
          mkdir -p dist
          # Copie des derniers fichiers compilés réels de l'application
          if [ -d "assets/public" ]; then
            cp -r assets/public/* dist/
          elif [ -f "index.html" ]; then
            cp -r * dist/ || true
          fi

      - name: Initialiser Capacitor avec la dernière version de BRADCI
        run: |
          rm -rf android package.json node_modules package-lock.json capacitor.config.ts
          npm init -y
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 typescript @types/node --save-exact
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF
          npx cap add android
          npx cap copy android

      - name: Configurer les autorisations Android (Permissions, Réseau, Médias)
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android final
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
