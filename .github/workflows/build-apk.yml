name: Construire APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Configuration de Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Configuration de Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configuration de Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accepter les licences Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Compiler l'application Vite avec Bun
        run: |
          # Éliminer tous les plugins natifs obsolètes du package.json
          sed -i '/@capacitor\/local-notifications/d' package.json || true
          sed -i '/@capacitor\/push-notifications/d' package.json || true
          sed -i '/@capacitor\/camera/d' package.json || true
          sed -i '/@capacitor\/geolocation/d' package.json || true
          
          bun install || npm install --legacy-peer-deps --force
          bun run build || npm run build || true

          mkdir -p dist
          if [ -d "assets/public" ]; then
            cp -rn assets/public/* dist/ || true
          fi
          if [ -f "index.html" ] && [ ! -f "dist/index.html" ]; then
            cp index.html dist/
          fi

          if [ -f "dist/index.html" ]; then
            sed -i 's|src="/|src="./|g' dist/index.html
            sed -i 's|href="/|href="./|g' dist/index.html
          fi

      - name: Initialiser le conteneur Android Capacitor
        run: |
          # Supprimer les dossiers résiduels de plugins natifs
          rm -rf node_modules/@capacitor/local-notifications
          rm -rf node_modules/@capacitor/push-notifications
          rm -rf node_modules/@capacitor/camera
          rm -rf node_modules/@capacitor/geolocation
          rm -rf android capacitor.config.ts

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.bradci.app",
            "appName": "BRADCI",
            "webDir": "dist",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https",
              "cleartext": true
            }
          }
          EOF
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4 --save-exact --legacy-peer-deps --force
          npx cap add android
          npx cap copy android

      - name: Appliquer le logo BRADCI (icon.png)
        run: |
          if [ -f "icon.png" ]; then
            RES_DIR="android/app/src/main/res"
            for d in $RES_DIR/mipmap-*; do
              if [ -d "$d" ] && [ "$(basename $d)" != "mipmap-anydpi-v26" ]; then
                cp icon.png "$d/ic_launcher.png"
                cp icon.png "$d/ic_launcher_round.png"
              fi
            done
          fi

      - name: Neutraliser les plugins natifs résiduels dans Gradle
        run: |
          cd android
          # Vider les déclarations de plugins dans capacitor.settings.gradle s'il existe
          if [ -f "capacitor.settings.gradle" ]; then
            > capacitor.settings.gradle
          fi

          # Nettoyer settings.gradle
          sed -i '/notifications/d' settings.gradle || true
          sed -i '/capacitor-camera/d' settings.gradle || true
          sed -i '/capacitor-geolocation/d' settings.gradle || true

          # Nettoyer app/build.gradle de toute dépendance vers un sous-projet
          sed -i '/project('\'':capacitor-/d' app/build.gradle || true

          # Activer MultiDex
          sed -i 's/defaultConfig {/defaultConfig {\n        multiDexEnabled true/g' app/build.gradle
          echo "android.suppressUnsupportedCompileSdk=34,35,36" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8" >> gradle.properties

          MANIFEST_FILE="app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />' $MANIFEST_FILE
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' $MANIFEST_FILE
          fi

      - name: Compiler l'APK Android final (Gradle)
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
