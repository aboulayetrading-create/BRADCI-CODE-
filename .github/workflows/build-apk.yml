name: Production de construction

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source (Checkout)
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installation des dépendances Web
        run: npm ci || npm install

      - name: Créer une application Web (Build React / Vite)
        run: npm run build

      - name: Installation de Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Configurer le SDK Android et Licences
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Synchroniser Capacitor avec Android
        run: npx cap sync android

      - name: Ajouter les autorisations du manifeste Android (GPS, appareil photo, micro)
        run: |
          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_FILE" ]; then
            sed -i '/<application/i \    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.INTERNET" />' $MANIFEST_FILE
          fi

      - name: Corriger les doublons Kotlin & Dépendances Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew clean --no-daemon

      - name: Compiler le package Android (Build APK Release / Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Téléverser l'APK généré en artefact
        uses: actions/upload-artifact@v4
        with:
          name: BRADCI-Application-APK
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
